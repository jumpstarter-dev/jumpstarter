# SSH credentials Secret — required by the qemu-ssh.jumpstarter.dev
# provisioner for authenticating to remote lab hosts.
#
# The credentialsSecretRef in the VirtualTargetClass points to this
# Secret. It uses the standard kubernetes.io/ssh-auth type.
#
# Create from a file (preferred):
#   kubectl create secret generic lab-ssh-key \
#     --from-file=ssh-privatekey=$HOME/.ssh/id_ed25519 \
#     -n jumpstarter
#
# Or apply this manifest after base64-encoding your key:
#   cat ~/.ssh/id_ed25519 | base64 -w0
apiVersion: v1
kind: Secret
metadata:
  name: lab-ssh-key
  namespace: jumpstarter
type: kubernetes.io/ssh-auth
data:
  # Replace with your base64-encoded SSH private key
  ssh-privatekey: <BASE64_ENCODED_SSH_PRIVATE_KEY>
