# VirtualTargetClass — off-cluster QEMU via SSH
#
# This example defines a virtual target profile for aarch64 targets
# running on a remote lab host (bare metal or VM with KVM). The
# exporter-set controller connects via SSH and deploys Podman
# containers (quadlets) on the host.
#
# Each ExporterSet manages one host. To use multiple hosts, create
# additional ExporterSets under this same VirtualTargetClass.
#
# Prerequisites:
#   1. Create the SSH credentials Secret:
#        kubectl create secret generic lab-ssh-key \
#          --from-file=ssh-privatekey=$HOME/.ssh/id_ed25519 \
#          -n jumpstarter
#   2. Ensure the remote host has Podman and systemd installed.
#   3. Enable qemu-ssh.jumpstarter.dev provisioner in the Jumpstarter CR.
apiVersion: virtualtarget.jumpstarter.dev/v1alpha1
kind: VirtualTargetClass
metadata:
  name: qemu-ssh-aarch64
  namespace: jumpstarter
spec:
  provisioner: qemu-ssh.jumpstarter.dev
  credentialsSecretRef:
    name: lab-ssh-key
  bindingMode: Immediate
  reclaimPolicy: Delete
  parameters:
    # SSH connection defaults (per-host overrides available in ExporterSet)
    ssh:
      user: root
      port: 22
    # Runtime container configuration
    runtime:
      kvm: true    # pass /dev/kvm into the QEMU runtime container
    # Default resource allocation per virtual target
    arch: aarch64
    resources:
      cpu: 4
      memory: 4Gi
    storage:
      size: 16Gi
