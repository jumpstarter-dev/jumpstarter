---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: leases.jumpstarter.dev
spec:
  group: jumpstarter.dev
  names:
    kind: Lease
    listKind: LeaseList
    plural: leases
    singular: lease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ended
      name: Ended
      type: boolean
    - jsonPath: .spec.clientRef.name
      name: Client
      type: string
    - jsonPath: .status.exporterRef.name
      name: Exporter
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Lease is the Schema for the leases API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LeaseSpec defines the desired state of Lease
            properties:
              allowDisabled:
                description: |-
                  AllowDisabled permits leasing a disabled exporter when used with ExporterRef.
                  When true and ExporterRef is set, the controller will allow leasing an exporter
                  even if its spec.enabled field is false. This is useful for investigating
                  broken exporters that have been administratively disabled.
                  Ignored for selector-based leases (disabled exporters are always filtered out).
                type: boolean
              beginTime:
                description: |-
                  Requested start time. If omitted, lease starts when exporter is acquired.
                  Immutable after lease starts (cannot change the past).
                format: date-time
                type: string
              clientRef:
                description: The client that is requesting the lease
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              constraints:
                description: Constraints are rules for sets of members. Immutable
                  after creation.
                items:
                  description: LeaseConstraint is a rule for a set of members of a
                    lease.
                  properties:
                    members:
                      description: Members are the role names that the rule applies
                        to.
                      items:
                        maxLength: 63
                        type: string
                      maxItems: 8
                      minItems: 2
                      type: array
                      x-kubernetes-list-type: set
                    sameLabel:
                      description: |-
                        SameLabel is a label key, for example "bus" or "rf-domain". The exporters
                        that the members bind must have the same value of this label. The
                        controller selects the value at bind time.
                      maxLength: 317
                      minLength: 1
                      type: string
                  required:
                  - members
                  - sameLabel
                  type: object
                maxItems: 4
                type: array
              context:
                additionalProperties:
                  type: string
                description: |-
                  User-defined context metadata for the lease (e.g. build_id, image_digest, VCS ref).
                  Immutable after creation. Maximum 8 entries; keys max 32 chars, values max 64 chars.
                maxProperties: 8
                type: object
              duration:
                description: |-
                  Duration of the lease. Must be positive when provided.
                  Can be omitted (nil) when both BeginTime and EndTime are provided,
                  in which case it's calculated as EndTime - BeginTime.
                type: string
              endTime:
                description: |-
                  Requested end time. If specified with BeginTime, Duration is calculated.
                  Can be updated to extend or shorten active leases.
                format: date-time
                type: string
              exporterRef:
                description: Optionally pin this lease to a specific exporter name.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              forwards:
                description: |-
                  Forwards connect ports on different members of a member-form lease
                  through the router. Each endpoint refers to a member of the lease, and
                  no forward has the name of a member. Immutable after creation.
                items:
                  description: |-
                    LeaseForward is one forward of a member-form lease: a named set of
                    endpoints. It connects one provides port to one or more requires ports, or
                    two connects ports. The controller gets the direction of each port from the
                    exporter reports.
                  properties:
                    endpoints:
                      description: |-
                        Endpoints are the ends of the forward, in any sequence. The list key
                        is the member, thus each endpoint is on a different member.
                      items:
                        description: |-
                          ForwardEndpoint is one end of a forward: a member of the lease and a port
                          that the exporter of that member reports.
                        properties:
                          member:
                            description: Member is the role name of the member.
                            maxLength: 63
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                          port:
                            description: Port is the name of the port on the exporter
                              of the member.
                            maxLength: 63
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                        - member
                        - port
                        type: object
                      maxItems: 8
                      minItems: 2
                      type: array
                      x-kubernetes-list-map-keys:
                      - member
                      x-kubernetes-list-type: map
                    name:
                      description: Name of the forward. It is a DNS label, as a role
                        name is.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - endpoints
                  - name
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              members:
                description: |-
                  Members makes this a member-form lease: each member has a role name and
                  selects one exporter. The controller binds all the required members or
                  none. Members cannot be used with the top-level selector or exporterRef.
                  Immutable after creation.
                items:
                  description: |-
                    LeaseMember is one member of a member-form lease: a role name and the
                    selection of one exporter.
                  properties:
                    allowDisabled:
                      description: AllowDisabled permits a disabled exporter when
                        used with ExporterRef.
                      type: boolean
                    excluded:
                      description: |-
                        Excluded tells the controller not to bind this optional member. Only
                        template expansion sets it, for a request that leaves the role out.
                      type: boolean
                    exporterRef:
                      description: ExporterRef pins the member to a specific exporter
                        name.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    name:
                      description: Name is the role name of the member, for example
                        "phone". It is a DNS label.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    optional:
                      description: Optional lets the lease become ready without this
                        member.
                      type: boolean
                    selector:
                      description: Selector selects the exporter of the member by
                        its labels.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: only an optional member can be excluded
                    rule: '!has(self.excluded) || !self.excluded || (has(self.optional)
                      && self.optional)'
                  - message: exactly one of selector or exporterRef.name is required
                    rule: '(((has(self.selector) && ((has(self.selector.matchLabels)
                      && size(self.selector.matchLabels) > 0) || (has(self.selector.matchExpressions)
                      && size(self.selector.matchExpressions) > 0))) ? 1 : 0) + ((has(self.exporterRef)
                      && has(self.exporterRef.name) && size(self.exporterRef.name)
                      > 0) ? 1 : 0)) == 1'
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              release:
                description: The release flag requests the controller to end the lease
                  now
                type: boolean
              selector:
                default: {}
                description: The selector for the exporter to be used
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              sharedWith:
                description: |-
                  List of client names that have shared access to this lease.
                  Only the lease owner can modify this list.
                items:
                  type: string
                maxItems: 10
                type: array
                x-kubernetes-list-type: set
              tags:
                additionalProperties:
                  type: string
                description: |-
                  User-defined tags for the lease. Immutable after creation.
                  Maximum 10 entries. Keys must be simple names (no slashes) conforming to Kubernetes label rules.
                maxProperties: 10
                type: object
              templateRef:
                description: |-
                  TemplateRef records the LeaseTemplate that this lease was expanded from.
                  The client service sets it; the controller does not read it at bind time.
                properties:
                  generation:
                    description: Generation is the metadata.generation of the template
                      at expansion.
                    format: int64
                    type: integer
                  name:
                    description: Name of the LeaseTemplate.
                    maxLength: 253
                    type: string
                required:
                - generation
                - name
                type: object
            required:
            - clientRef
            - selector
            type: object
            x-kubernetes-validations:
            - message: one of selector or exporterRef.name is required, or members
                for a lease of more than one exporter
              rule: ((has(self.selector.matchLabels) && size(self.selector.matchLabels)
                > 0) || (has(self.selector.matchExpressions) && size(self.selector.matchExpressions)
                > 0)) || (has(self.exporterRef) && has(self.exporterRef.name) && size(self.exporterRef.name)
                > 0) || (has(self.members) && size(self.members) > 0)
            - message: members cannot be used with selector or exporterRef
              rule: '!(has(self.members) && size(self.members) > 0) || !(((has(self.selector.matchLabels)
                && size(self.selector.matchLabels) > 0) || (has(self.selector.matchExpressions)
                && size(self.selector.matchExpressions) > 0)) || (has(self.exporterRef)
                && has(self.exporterRef.name) && size(self.exporterRef.name) > 0))'
            - message: a lease with members must have a required member
              rule: '!has(self.members) || size(self.members) == 0 || self.members.exists(m,
                !has(m.optional) || !m.optional)'
            - message: constraints must reference declared members
              rule: '!has(self.constraints) || (has(self.members) && self.constraints.all(c,
                c.members.all(n, self.members.exists(m, m.name == n))))'
            - message: members are immutable after creation
              rule: has(self.members) == has(oldSelf.members) && (!has(self.members)
                || self.members == oldSelf.members)
            - message: constraints are immutable after creation
              rule: has(self.constraints) == has(oldSelf.constraints) && (!has(self.constraints)
                || self.constraints == oldSelf.constraints)
            - message: forward endpoints must reference declared members
              rule: '!has(self.forwards) || (has(self.members) && self.forwards.all(f,
                f.endpoints.all(e, self.members.exists(m, m.name == e.member))))'
            - message: a forward and a member cannot have the same name
              rule: '!has(self.forwards) || !has(self.members) || self.forwards.all(f,
                !self.members.exists(m, m.name == f.name))'
            - message: forwards are immutable after creation
              rule: has(self.forwards) == has(oldSelf.forwards) && (!has(self.forwards)
                || self.forwards == oldSelf.forwards)
            - message: templateRef is immutable after creation
              rule: has(self.templateRef) == has(oldSelf.templateRef) && (!has(self.templateRef)
                || self.templateRef == oldSelf.templateRef)
            - message: tags are immutable after creation
              rule: '!has(oldSelf.tags) || self.tags == oldSelf.tags'
            - message: context is immutable after creation
              rule: '!has(oldSelf.context) || self.context == oldSelf.context'
            - message: context keys max 32 chars, values max 64 chars
              rule: '!has(self.context) || self.context.all(k, size(k) <= 32 && size(self.context[k])
                <= 64)'
          status:
            description: LeaseStatus defines the observed state of Lease.
            properties:
              beginTime:
                description: BeginTime is the actual start time of the lease.
                format: date-time
                type: string
              bindAttempt:
                description: |-
                  BindAttempt counts the bind attempts of this lease. Each ExporterClaim
                  of the lease records the attempt that created it.
                format: int64
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                  of the lease state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endTime:
                description: EndTime is the actual end time of the lease.
                format: date-time
                type: string
              ended:
                description: Ended indicates whether the lease has been terminated.
                type: boolean
              exclusionGroups:
                description: ExclusionGroups are the exclusion groups that this lease
                  holds.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              exporterRef:
                description: |-
                  ExporterRef is a reference to the exporter assigned to this lease.
                  It stays nil for a member-form lease: see Members.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              forwards:
                description: Forwards is the state of each forward of the lease, in
                  spec order.
                items:
                  description: LeaseForwardStatus is the observed state of one forward
                    of a lease.
                  properties:
                    ends:
                      description: |-
                        Ends is the state of each bound end of the forward, in the order of
                        the endpoints. The key is the member. The controller service writes
                        the reports and the setup times; the lease controller calculates State
                        from them.
                      items:
                        description: |-
                          LeaseForwardEndStatus is the observed state of one end of a forward: the
                          last report that the controller accepted from the exporter of the member,
                          and the time of the last setup instruction.
                        properties:
                          member:
                            description: Member is the role name of the member of
                              this end.
                            type: string
                          message:
                            description: Message is the cause that a Failed report
                              gave.
                            type: string
                          reportTime:
                            description: ReportTime is the time of the last report
                              that the controller accepted.
                            format: date-time
                            type: string
                          sequence:
                            description: |-
                              Sequence is the sequence number of the last report that the controller
                              accepted. A report with a number that is not larger is ignored.
                            format: int64
                            minimum: 0
                            type: integer
                          setupTime:
                            description: SetupTime is the time of the last setup instruction
                              for this end.
                            format: date-time
                            type: string
                          state:
                            description: |-
                              State is the state of the last accepted report. It is Pending until
                              the exporter sends a report.
                            enum:
                            - Pending
                            - Ready
                            - Connected
                            - Failed
                            type: string
                        required:
                        - member
                        - state
                        type: object
                      maxItems: 8
                      type: array
                      x-kubernetes-list-map-keys:
                      - member
                      x-kubernetes-list-type: map
                    message:
                      description: |-
                        Message is a human-readable message for the state: the role of the
                        Omitted member of a Disabled forward, or the cause of a failure.
                      type: string
                    name:
                      description: Name of the forward.
                      type: string
                    state:
                      description: State of the forward.
                      enum:
                      - Pending
                      - Disabled
                      - Listening
                      - Connected
                      - Failed
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              members:
                description: Members is the state of each member of a member-form
                  lease, in spec order.
                items:
                  description: LeaseMemberStatus is the observed state of one member
                    of a lease.
                  properties:
                    exporterRef:
                      description: ExporterRef is the exporter of the member. A Lost
                        member keeps it.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    message:
                      description: Message is a human-readable message for the state.
                      type: string
                    name:
                      description: Name is the role name of the member.
                      type: string
                    priority:
                      description: Priority is the priority of the member from the
                        access policy.
                      type: integer
                    reason:
                      description: Reason is a machine-readable reason for the state.
                      type: string
                    spotAccess:
                      description: SpotAccess indicates whether the member was granted
                        with spot access.
                      type: boolean
                    state:
                      description: State of the member.
                      enum:
                      - Pending
                      - Bound
                      - Omitted
                      - Lost
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              priority:
                description: Priority is the effective priority of the lease from
                  the access policy.
                type: integer
              sharedWith:
                description: |-
                  SharedWith is the effective set of client names granted shared access to
                  this lease. It is derived by the controller from Spec.SharedWith after
                  evaluating exporter access policies; Spec.SharedWith remains the owner's
                  desired intent and is never mutated by the controller.
                items:
                  type: string
                type: array
              spotAccess:
                description: SpotAccess indicates whether this lease was granted with
                  spot (preemptible) access.
                type: boolean
            required:
            - ended
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
