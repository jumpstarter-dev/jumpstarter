# A mock board, served in-process by the Robot Framework example ("local
# mode"): no controller, hardware or `jmp shell` needed.
apiVersion: jumpstarter.dev/v1alpha1
kind: ExporterConfig
metadata:
  namespace: default
  name: mock-bench
endpoint: ""
token: ""
export:
  power:
    type: jumpstarter_driver_power.driver.MockPower
  storage:
    type: jumpstarter_driver_opendal.driver.MockStorageMuxFlasher
  console:
    type: jumpstarter_driver_network.driver.EchoNetwork
  shell:
    type: jumpstarter_driver_shell.driver.Shell
    config:
      methods:
        hello: "echo \"$GREETING $@\""
        fail: "echo \"failing on purpose\" >&2; exit 3"
