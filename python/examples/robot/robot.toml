# Settings for RobotCode and the Jumpstarter client generator. Plain `robot`
# does not read this file: everything a run needs is in client.resource.
paths = ["tests"]
output-dir = "results"

# `jmp-robot generate` (re)writes client.resource from exporter.yaml. The table
# name is the session name.
[tool.jumpstarter.client.default]
exporter-config = "exporter.yaml"
resource = "client.resource"
