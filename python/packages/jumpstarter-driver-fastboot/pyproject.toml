[project]
name = "jumpstarter-driver-fastboot"
dynamic = ["version", "urls"]
description = "Generic fastboot flasher with exporter-side staging and lease-independent flash jobs"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Kirk Brauer", email = "kirkebrauer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.10.0",
    "click>=8.1.7",
    "jumpstarter",
    "jumpstarter-driver-power",
    "oras>=0.2.25",
    "pydantic>=2.0",
    "pyyaml>=6.0.2",
    "zstandard>=0.23.0",
]

[project.entry-points."jumpstarter.drivers"]
FastbootFlasher = "jumpstarter_driver_fastboot.driver:FastbootFlasher"

[tool.hatch.version]
source = "vcs"
raw-options = { 'root' = '../../../'}

[tool.hatch.metadata.hooks.vcs.urls]
Homepage = "https://jumpstarter.dev"
source_archive = "https://github.com/jumpstarter-dev/repo/archive/{commit_hash}.zip"

[tool.pytest.ini_options]
addopts = "--cov --cov-report=html --cov-report=xml"
log_cli = true
log_cli_level = "INFO"
testpaths = ["jumpstarter_driver_fastboot"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-pin-jumpstarter"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.pin_jumpstarter]
name = "pin_jumpstarter"

[dependency-groups]
dev = [
    "jumpstarter-cli",
    "jumpstarter-driver-composite",
    "jumpstarter-driver-pyserial",
    "pytest-asyncio>=0.0.0",
    "pytest-cov>=6.0.0",
    "pytest>=8.3.3",
]
