apiVersion: jumpstarter.dev/v1alpha1
kind: ExporterConfig
metadata:
  namespace: default
  name: demo
endpoint: grpc.jumpstarter.example.com:8082
token: "<token>"
export:
  nanokvm-usb:
    type: jumpstarter_driver_nanokvm_usb.driver.NanoKVMUSB
    config:
      serial_port: "/dev/ttyACM0"
      baud_rate: 57600
      video_device: "/dev/v4l/by-path/pci-0000:00:14.0-usbv2-0:3.4.3:1.0-video-index0"
      video_width: 1920
      video_height: 1080
      video_fps: 30
      screen_width: 1920
      screen_height: 1080
      vnc_enabled: true
      # vnc_layout: es  # DUT keyboard layout (default us)
      # vnc_password: "secret"
      # vnc_tcp_port: 5900
      # vnc_tcp_bind: "0.0.0.0"  # LAN; use vnc_password
