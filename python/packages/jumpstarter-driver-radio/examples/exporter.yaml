apiVersion: jumpstarter.dev/v1alpha1
kind: ExporterConfig
metadata:
  namespace: default
  name: cuttlefish-wifi
endpoint: grpc.jumpstarter.example.com:443
token: "<token>"
export:
  # The device, and the frame port of its Wi-Fi medium beside it.
  cuttlefish:
    type: jumpstarter_driver_cuttlefish.driver.Cuttlefish
    config:
      env_config:
        instances:
          - disk:
              default_build: /home/vsoc-01/fetch
  wifi:
    type: jumpstarter_driver_radio.wmediumd.WmediumdWifi
    config:
      port: 7310
