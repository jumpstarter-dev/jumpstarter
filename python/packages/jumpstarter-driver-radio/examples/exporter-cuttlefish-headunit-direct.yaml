# A virtual Android Automotive head unit (Cuttlefish) whose Bluetooth controller simulator another virtual
# device of the lease uses directly: no bridge. See exporter-cuttlefish-phone-direct.yaml.
apiVersion: jumpstarter.dev/v1alpha1
kind: ExporterConfig
metadata:
  namespace: default
  name: cuttlefish-headunit-direct
endpoint: grpc.jumpstarter.example.com:443
token: "<token>"
export:
  cuttlefish:
    type: jumpstarter_driver_cuttlefish.driver.Cuttlefish
    config:
      env_config:
        instances:
          - vm: { cpus: 4, memory_mb: 8192 }
  android:
    type: jumpstarter_driver_adb.driver.AdbDevice
    config:
      address: 127.0.0.1:6520
      transport: tcp
  # Port `bluetooth` (provides, hci-h4): the HCI port of this device's simulator (rootcanal). Each connection
  # a forward brings is one more host of it, with a controller and an address of its own.
  bluetooth:
    type: jumpstarter_driver_radio.direct.RootcanalController
    config:
      port: 7300 # --hci_port: 7300 + instance_num - 1
