[project]
name = "jumpstarter-driver-iossimulator"
dynamic = ["version", "urls"]
description = "iOS Simulator lifecycle and idb transport for Jumpstarter"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Kirk Brauer", email = "kbrauer@hatci.com" },
]
requires-python = ">=3.12"
dependencies = [
  "h11>=0.16.0",
  "jumpstarter",
  "jumpstarter-driver-composite",
  "jumpstarter-driver-iosdevice",
  "jumpstarter-driver-power",
]

[project.entry-points."jumpstarter.drivers"]
IosSimulator = "jumpstarter_driver_iossimulator.driver:IosSimulator"

[tool.hatch.version]
source = "vcs"
raw-options = { 'root' = '../../../' }

[tool.hatch.metadata.hooks.vcs.urls]
Homepage = "https://jumpstarter.dev"
source_archive = "https://github.com/jumpstarter-dev/repo/archive/{commit_hash}.zip"

[tool.pytest.ini_options]
addopts = "--cov --cov-report=html --cov-report=xml"
log_cli = true
log_cli_level = "INFO"
testpaths = ["jumpstarter_driver_iossimulator"]

[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-pin-jumpstarter"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.pin_jumpstarter]
name = "pin_jumpstarter"

[dependency-groups]
dev = [
  "pytest-cov>=6.0.0",
  "pytest>=8.3.3",
]
