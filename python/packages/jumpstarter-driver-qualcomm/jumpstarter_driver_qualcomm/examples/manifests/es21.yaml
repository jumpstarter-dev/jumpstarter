name: "SA8775P ES21 Firmware"
description: "ES21 firmware update package (QDL)"
data:
  folder: "r00001.1"
  abl_image: "abl/mar_2026_mkorpershoek/sa8775p_es21_abl_signed.elf"
  cdt_image:
    v1: "cdt/LEMANSAU_QAM_1.1.0.bin"
    v2: "cdt/LEMANSAU_QAM_1.1.0.bin"
    v3: "cdt/LEMANSAU_QAM_1.2.0.bin"
    v4: "cdt/LEMANSAU_QAM_1.2.0.bin"
steps:
  - set_mode: edl
    check_dmesg: "USB QTI_HS"

  - name: "UFS Provisioning"
    retry_mode: edl
    qdl:
      storage: ufs
      programmer: prog_firehose_ddr.elf
      files:
        - provision_default.xml

  - sleep: 5

  - name: "Flash UFS"
    retry_mode: edl
    qdl:
      storage: ufs
      programmer: prog_firehose_ddr.elf
      files:
        - "rawprogram*.xml"
        - "patch*.xml"

  - sleep: 10

  - name: "Flash SPINOR"
    retry_mode: edl
    qdl:
      storage: spinor
      programmer: prog_firehose_ddr.elf
      files:
        - "rawprogram*.xml"

  - sleep: 5

  - set_mode: fastboot
    check_dmesg: "Product: Android"
