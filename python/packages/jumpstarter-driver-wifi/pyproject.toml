[project]
name = "jumpstarter-driver-wifi"
dynamic = ["version", "urls"]
description = "A device's Wi-Fi, on a simulated medium or a real test network, as a port that can be joined between exporters"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Kirk Brauer" }]
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.10.0",
    "click>=8.0.0",
    "jumpstarter",
    "jumpstarter-driver-composite",
]

[project.entry-points."jumpstarter.drivers"]
WifiGateway = "jumpstarter_driver_wifi.driver:WifiGateway"
WifiMedium = "jumpstarter_driver_wifi.driver:WifiMedium"

[tool.hatch.version]
source = "vcs"
raw-options = { 'root' = '../../../' }

[tool.hatch.metadata.hooks.vcs.urls]
Homepage = "https://jumpstarter.dev"
source_archive = "https://github.com/jumpstarter-dev/repo/archive/{commit_hash}.zip"

[tool.pytest.ini_options]
addopts = "--cov=jumpstarter_driver_wifi --cov-report=html --cov-report=xml"
testpaths = ["jumpstarter_driver_wifi"]

[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-pin-jumpstarter"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-cov>=6.0.0",
    "pytest>=8.4",
]

[tool.hatch.build.hooks.pin_jumpstarter]
name = "pin_jumpstarter"
