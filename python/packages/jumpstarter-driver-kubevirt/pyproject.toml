[project]
name = "jumpstarter-driver-kubevirt"
dynamic = ["version", "urls"]
description = "Jumpstarter driver for KubeVirt virtual machines"
authors = [
  { name = "Benny Zlotnik", email = "bzlotnik@redhat.com" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "jumpstarter",
  "jumpstarter-driver-composite",
  "jumpstarter-driver-power",
  "jumpstarter-driver-network",
  "lightkube>=0.15",
  "websockets>=13.0",
]

[project.entry-points."jumpstarter.drivers"]
Kubevirt = "jumpstarter_driver_kubevirt.driver:Kubevirt"
KubevirtPower = "jumpstarter_driver_kubevirt.driver:KubevirtPower"
KubevirtConsole = "jumpstarter_driver_kubevirt.driver:KubevirtConsole"
KubevirtStorage = "jumpstarter_driver_kubevirt.driver:KubevirtStorage"

[dependency-groups]
dev = ["pytest>=8.3.2", "pytest-cov>=5.0.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.metadata.hooks.vcs.urls]
Homepage = "https://jumpstarter.dev"
source_archive = "https://github.com/jumpstarter-dev/repo/archive/{commit_hash}.zip"

[tool.hatch.version]
source = "vcs"
raw-options = { 'root' = '../../../' }

[tool.uv.sources]
jumpstarter-driver-composite = { workspace = true }
jumpstarter-driver-network = { workspace = true }
jumpstarter-driver-power = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-pin-jumpstarter"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.pin_jumpstarter]
name = "pin_jumpstarter"
