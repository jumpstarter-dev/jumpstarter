[project]
name = "jumpstarter-driver-bt-peer"
dynamic = ["version", "urls"]
description = "Bluetooth peer driver powered by bumble"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Benny Zlotnik", email = "bzlotnik@redhat.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.10.0",
    "bumble>=0.0.233",
    "jumpstarter",
]

[project.entry-points."jumpstarter.drivers"]
BtPeer = "jumpstarter_driver_bt_peer.driver:BtPeer"

[tool.hatch.version]
source = "vcs"
raw-options = { 'root' = '../../../'}

[tool.hatch.metadata.hooks.vcs.urls]
Homepage = "https://jumpstarter.dev"
source_archive = "https://github.com/jumpstarter-dev/jumpstarter/archive/{commit_hash}.zip"

[tool.pytest.ini_options]
addopts = "--cov --cov-report=html --cov-report=xml"
log_cli = true
log_cli_level = "INFO"
testpaths = ["jumpstarter_driver_bt_peer"]

[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-pin-jumpstarter"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.pin_jumpstarter]
name = "pin_jumpstarter"

[dependency-groups]
dev = [
    "pytest-anyio>=0.0.0",
    "pytest-cov>=6.0.0",
    "pytest>=8.3.3",
]
