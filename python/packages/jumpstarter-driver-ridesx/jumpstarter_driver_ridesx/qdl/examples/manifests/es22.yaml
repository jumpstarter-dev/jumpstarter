name: "SA8775P ES22 AWE Firmware"
description: "ES22 AWE firmware update package (QDL)"
data:
  folder: "r00002.2a_AWE"
  extract_to_folder: true
  abl_image: "sa8775p_es21_abl_signed.elf"
  cdt_image:
    v1: "ufs/LEMANSAU_QAM_1.1.0.bin"
    v2: "ufs/LEMANSAU_QAM_1.1.0.bin"
    v3: "ufs/LEMANSAU_QAM_1.2.0.bin"
    v4: "ufs/LEMANSAU_QAM_1.2.0.bin"
steps:
  - set_mode: edl
    check_dmesg: "USB QTI_HS"

  - name: "UFS Provisioning"
    retry_mode: edl
    qdl:
      storage: ufs
      programmer: prog_firehose_ddr.elf
      files:
        - provision_default.xml

  - sleep: 5

  - set_mode: edl
    check_dmesg: "USB QTI_HS"

  - name: "Flash UFS"
    retry_mode: edl
    qdl:
      storage: ufs
      programmer: prog_firehose_ddr.elf
      files:
        - "rawprogram*.xml"
        - "patch*.xml"

  - sleep: 10

  - set_mode: edl
    check_dmesg: "USB QTI_HS"

  - name: "Flash SPINOR"
    retry_mode: edl
    qdl:
      storage: spinor
      programmer: prog_firehose_ddr.elf
      files:
        - "rawprogram*.xml"

  - sleep: 5

  - set_mode: fastboot
    check_dmesg: "Product: Android"
