[tool.uv]
# Ensure uv resolves versions that ship pre-built cp314 wheels on Python 3.14.
# Without these constraints the resolver can pick older releases that only
# provide cp312/cp313 wheels, forcing slow (or failing) source builds in CI.
constraint-dependencies = [
    # pydantic >=2.12 requires typing-extensions >=4.14.1, but mitmproxy caps
    # typing-extensions <=4.14 on Python <3.13. On Python >=3.14 we need
    # pydantic >=2.12 so that pydantic-core ships pre-built cp314 wheels.
    "pydantic>=2.12 ; python_version >= '3.14'",
    # Pillow 11.3.0 is the first release that ships cp314 wheels;
    # without this constraint uv can pick an older sdist-only version
    # that fails to build on Python 3.14.
    "pillow>=11.3.0 ; python_version >= '3.14'",
    # SciPy 1.16.1 is the first release that ships cp314 wheels;
    # 1.16.0 falls back to an sdist build that requires OpenBLAS,
    # which is not available in the CI environment.
    "scipy>=1.16.1 ; python_version >= '3.14'",
    # NumPy 2.3.2 and PyWavelets 1.9.0 are the first releases that
    # ship cp314 wheels; without these constraints uv falls back to
    # slow sdist builds on Python 3.14.
    "numpy>=2.3.2 ; python_version >= '3.14'",
    "pywavelets>=1.9.0 ; python_version >= '3.14'",
    # aiohttp 3.13.0 is the first release that ships cp314 wheels.
    "aiohttp>=3.13.0 ; python_version >= '3.14'",
    # cffi 2.0.0 is the first release that ships cp314 wheels;
    # consumers (cryptography, pynacl, …) accept cffi >=1.14.
    "cffi>=2.0.0 ; python_version >= '3.14'",
    # grpcio 1.75.1 is the first release that ships cp314 wheels;
    # building from source takes 10+ minutes.
    "grpcio>=1.75.1 ; python_version >= '3.14'",
    # MarkupSafe 3.0.3 is the first release that ships cp314 wheels.
    "markupsafe>=3.0.3 ; python_version >= '3.14'",
    # msgpack 1.1.2 is the first release that ships cp314 wheels.
    "msgpack>=1.1.2 ; python_version >= '3.14'",
    # PyYAML 6.0.3 is the first release that ships cp314 wheels.
    "pyyaml>=6.0.3 ; python_version >= '3.14'",
    # rpds-py 0.26.0 is the first release that ships cp314 wheels.
    "rpds-py>=0.26.0 ; python_version >= '3.14'",
    # gpiod 2.4.0 is the first release that ships cp314 wheels.
    "gpiod>=2.4.0 ; python_version >= '3.14'",
]

[dependency-groups]
docs = [
    "sphinx<9.1.1",
    "myst-parser>=5.0.0",
    "sphinxcontrib-mermaid>=2.0.1",
    "furo>=2024.8.6",
    "esbonio>=0.16.4",
    "sphinx-autobuild>=2024.4.16",
    "sphinx-click>=6.0.0",
    "sphinx-substitution-extensions>=2026.6.17",
    "requests>=2.33.1",
    "sphinxcontrib-programoutput>=0.19",
    "sphinx-copybutton>=0.5.2",
    "sphinx-inline-tabs>=2023.4.21",
    "pyyaml>=6.0",
]
dev = [
    "ruff==0.15.22",
    "typos>=1.23.6",
    "pre-commit>=3.8.0",
    "esbonio>=0.16.5",
    "ty>=0.0.1a8",
    "diff-cover>=10.2.0",
]

[tool.ruff]
target-version = "py312"
exclude = ["packages/jumpstarter-protocol"]
line-length = 120

[tool.ruff.lint]
exclude = ["packages/jumpstarter-protocol"]
extend-select = ["I", "C", "E", "F", "W", "B", "ERA"]

[tool.ruff.lint.isort]
known-local-folder = ["packages", "examples", "jumpstarter"]


[tool.typos.default]
locale = "en-us"

[tool.typos.default.extend-words]
ser = "ser"
Pn = "Pn"
mosquitto = "mosquitto"

[tool.coverage.run]
branch = true
omit = ["conftest.py", "test_*.py", "*_test.py", "*_pb2.py", "*_pb2_grpc.py"]
skip_empty = true

[tool.pytest.ini_options]
addopts = "--capture=no --doctest-modules --cov=. --cov-report=html --cov-report=xml"

[tool.hatch.version]
source = "vcs"
