name: Controller Unit/Functional tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'controller/**'
      - 'protocol/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Cache controller bin directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: controller/bin/
          key: ${{ runner.os }}-controller-bin-${{ hashFiles('controller/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-controller-bin-

      - name: Run controller tests
        working-directory: controller
        run: make test

      - name: Cache operator bin directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: controller/deploy/operator/bin/
          key: ${{ runner.os }}-operator-bin-${{ hashFiles('controller/deploy/operator/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-operator-bin-

      - name: Install Grafana Alloy v1.21.3
        run: |
          curl -fsSL -o /tmp/alloy-linux-amd64.zip \
            https://github.com/grafana/alloy/releases/download/v1.21.3/alloy-linux-amd64.zip
          echo "50d23af2d0f98c00beac6ce9a365693e60f87fb76b6cad6fe1d161e80588af6d  /tmp/alloy-linux-amd64.zip" | sha256sum -c -
          mkdir -p /tmp/alloy
          unzip -q /tmp/alloy-linux-amd64.zip -d /tmp/alloy
          chmod +x /tmp/alloy/alloy-linux-amd64
          echo "ALLOY_BIN=/tmp/alloy/alloy-linux-amd64" >> "$GITHUB_ENV"
          /tmp/alloy/alloy-linux-amd64 --version

      - name: Install Vector v0.61.0
        run: |
          curl -fsSL -o /tmp/vector.tar.gz \
            https://github.com/vectordotdev/vector/releases/download/v0.61.0/vector-0.61.0-x86_64-unknown-linux-musl.tar.gz
          echo "e1609b8a55ef1c1fc4fd88633e2bc6366e9a4022f6f1ae846cadd27af5237621  /tmp/vector.tar.gz" | sha256sum -c -
          mkdir -p /tmp/vector
          tar -xzf /tmp/vector.tar.gz -C /tmp/vector
          echo "VECTOR_BIN=/tmp/vector/vector-x86_64-unknown-linux-musl/bin/vector" >> "$GITHUB_ENV"
          /tmp/vector/vector-x86_64-unknown-linux-musl/bin/vector --version

      - name: Run operator tests
        run: make -C controller/deploy/operator test
