name: Controller Unit/Functional tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'controller/**'
      - 'protocol/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Cache controller bin directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: controller/bin/
          key: ${{ runner.os }}-controller-bin-${{ hashFiles('controller/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-controller-bin-

      - name: Run controller tests
        working-directory: controller
        run: make test

      - name: Cache operator bin directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: controller/deploy/operator/bin/
          key: ${{ runner.os }}-operator-bin-${{ hashFiles('controller/deploy/operator/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-operator-bin-

      - name: Run operator tests
        run: make -C controller/deploy/operator test

      - name: Check generated code and manifests are up to date
        run: |
          git add --intent-to-add .
          git diff --exit-code || {
            echo "::error::Generated code or manifests are out of date. Run 'make manifests generate fmt' in controller/ and controller/deploy/operator/ and commit the result."
            exit 1
          }
