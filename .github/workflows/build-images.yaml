name: Build and push container images

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
    branches:
      - main
      - 'release-*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:

env:
  PUSH: ${{ github.repository_owner == 'jumpstarter-dev' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release-') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
  REGISTRY: quay.io
  QUAY_ORG: quay.io/jumpstarter-dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    if: github.event_name != 'pull_request' || contains(toJSON(github.event.pull_request.labels.*.name), 'build-pr-images')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Controller images
          - image_name: jumpstarter-dev/jumpstarter-controller
            label: jumpstarter-controller
            dockerfile: controller/Containerfile
            context: controller
          - image_name: jumpstarter-dev/jumpstarter-exporterset-controller
            label: jumpstarter-exporterset-controller
            dockerfile: controller/Containerfile.exporter-set-controller
            context: controller
          - image_name: jumpstarter-dev/virtual/qemu-runtime
            label: qemu-runtime
            dockerfile: controller/Containerfile.qemu-runtime
            context: controller
          - image_name: jumpstarter-dev/jumpstarter-operator
            label: jumpstarter-operator
            dockerfile: controller/Containerfile.operator
            context: controller
          - image_name: jumpstarter-dev/jumpstarter-operator-bundle
            label: jumpstarter-operator-bundle
            dockerfile: controller/deploy/operator/Containerfile.bundle
            context: controller/deploy/operator
            generate_bundle: true
          - image_name: jumpstarter-dev/microshift/bootc
            dockerfile: controller/deploy/microshift-bootc/Containerfile
            context: controller
            generate_installer: true
          # Python images (use repo root context for .git access needed by hatch-vcs)
          - image_name: jumpstarter-dev/jumpstarter
            label: jumpstarter
            dockerfile: python/Containerfile
            context: .
          - image_name: jumpstarter-dev/jumpstarter-utils
            label: jumpstarter-utils
            dockerfile: python/Containerfile.utils
            context: python
          - image_name: jumpstarter-dev/jumpstarter-dev
            label: jumpstarter-dev
            dockerfile: python/.devfile/Containerfile
            context: .
          - image_name: jumpstarter-dev/jumpstarter-devspace
            label: jumpstarter-devspace
            dockerfile: python/.devfile/Containerfile.client
            context: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check if this image should be built
        id: check
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          IMAGE_LABEL: ${{ matrix.label }}
        run: |
          # build-pr-images builds all images, build-pr-images/<label> builds a specific one
          if echo "$LABELS" | jq -e 'index("build-pr-images")' > /dev/null 2>&1; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | jq -e --arg label "build-pr-images/$IMAGE_LABEL" 'index($label)' > /dev/null 2>&1; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Get version
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION=$(git describe --tags)
          VERSION=${VERSION#v} # remove the leading v prefix for version
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}"

          # Convert to PEP 440 compliant version for Python packages
          # Format: 0.7.0-1051-g54cd2f08 -> 0.7.0.dev1051+g54cd2f08
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-g([a-f0-9]+)$ ]]; then
            PEP440_VERSION="${BASH_REMATCH[1]}.dev${BASH_REMATCH[2]}+g${BASH_REMATCH[3]}"
          else
            # If it's already a clean version (e.g., 0.7.0), use as-is
            PEP440_VERSION="$VERSION"
          fi
          echo "PEP440_VERSION=${PEP440_VERSION}" >> $GITHUB_ENV
          echo "PEP440_VERSION=${PEP440_VERSION}"

          # OLM orders bundles by semver precedence. In 0.10.0-dev-248-g54cd2f08
          # the prerelease "dev-248-g54cd2f08" is one identifier, compared as
          # text (dev-1000 sorts before dev-999), so the bundle gets the commit
          # count as a numeric identifier of its own: 0.10.0-dev.248.
          BUNDLE_VERSION=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+)-([0-9]+)-g[0-9a-f]+$/\1.\2/')
          echo "BUNDLE_VERSION=${BUNDLE_VERSION}" >> $GITHUB_ENV
          echo "BUNDLE_VERSION=${BUNDLE_VERSION}"

      - name: Set build args
        if: steps.check.outputs.skip != 'true'
        id: build-args
        run: |
          GIT_COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "git_commit=${GIT_COMMIT}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT=${GIT_COMMIT}"
          echo "BUILD_DATE=${BUILD_DATE}"

      - name: Generate operator bundle
        if: ${{ matrix.generate_bundle && steps.check.outputs.skip != 'true' }}
        run: make bundle VERSION=${{ env.BUNDLE_VERSION }} IMG=${{ env.QUAY_ORG }}/jumpstarter-operator:${{ env.VERSION }}
        working-directory: controller/deploy/operator

      - name: Set up Go
        if: ${{ matrix.generate_installer && steps.check.outputs.skip != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"

      - name: Build operator installer manifest
        if: ${{ matrix.generate_installer && steps.check.outputs.skip != 'true' }}
        run: |
          IMG="${{ env.QUAY_ORG }}/jumpstarter-operator:${{ env.VERSION }}"
          make -C controller/deploy/operator build-installer IMG="${IMG}"

      - name: Set image tags
        if: ${{ env.PUSH == 'true' && steps.check.outputs.skip != 'true' }}
        id: set-tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ env.VERSION }}"

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ matrix.image_name }}:latest"
          fi

          if [[ "${{ github.ref }}" == refs/heads/release-* ]]; then
            RELEASE_BRANCH_NAME=$(basename "${{ github.ref }}")
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ matrix.image_name }}:${RELEASE_BRANCH_NAME}"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: ${{ env.PUSH == 'true' && steps.check.outputs.skip != 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: jumpstarter-dev+jumpstarter_ci
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=pr,prefix=pr-
          labels: |
            quay.expires-after=${{ github.event_name == 'pull_request' && '7d' || '' }}

      - name: Build and push Docker image
        if: steps.check.outputs.skip != 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH }}
          tags: ${{ github.event_name == 'pull_request' && steps.meta.outputs.tags || steps.set-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_VERSION=${{ env.PEP440_VERSION }}
            GIT_COMMIT=${{ steps.build-args.outputs.git_commit }}
            BUILD_DATE=${{ steps.build-args.outputs.build_date }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: ${{ env.PUSH == 'true' && steps.check.outputs.skip != 'true' }}
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: ${{ env.PUSH }}

  comment-pr-images:
    needs: build-and-push-image
    if: github.event_name == 'pull_request' && contains(toJSON(github.event.pull_request.labels.*.name), 'build-pr-images')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR with image URIs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const registry = 'quay.io';
            const tag = `pr-${prNumber}`;
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const buildAll = labels.includes('build-pr-images');
            const allImages = [
              'jumpstarter-dev/jumpstarter-controller',
              'jumpstarter-dev/jumpstarter-exporterset-controller',
              'jumpstarter-dev/virtual/qemu-runtime',
              'jumpstarter-dev/jumpstarter-operator',
              'jumpstarter-dev/jumpstarter-operator-bundle',
              'jumpstarter-dev/jumpstarter',
              'jumpstarter-dev/jumpstarter-utils',
              'jumpstarter-dev/jumpstarter-dev',
              'jumpstarter-dev/jumpstarter-devspace',
            ];
            const images = buildAll ? allImages : allImages.filter(img => {
              const shortName = img.split('/')[1];
              return labels.includes(`build-pr-images/${shortName}`);
            });

            if (images.length === 0) return;

            const body = [
              '## Container Images',
              '',
              'The following container images have been built for this PR:',
              '',
              '| Image | URI |',
              '|-------|-----|',
              ...images.map(img => `| \`${img.split('/')[1]}\` | \`${registry}/${img}:${tag}\` |`),
              '',
              '_Images expire after 7 days._',
            ].join('\n');

            // Update existing comment or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Container Images')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # Publishes an OLM catalog that follows main. Its one channel, "unstable",
  # holds only the bundle built from this commit, whose skipRange lets OLM
  # upgrade to it from any lower version. It waits for every image of the
  # run, since the bundle deploys them.
  publish-unstable-catalog:
    needs: build-and-push-image
    if: github.repository_owner == 'jumpstarter-dev' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One publish at a time, so no other run can push between this run's
    # head-of-main check and its own push.
    concurrency:
      group: publish-unstable-catalog
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: jumpstarter-dev+jumpstarter_ci
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Publish catalog
        working-directory: controller/deploy/operator
        run: |
          # Runs for consecutive commits overlap and reach this job in any
          # order. Only the run for the current head of main publishes, so an
          # older run that finishes late cannot move the channel back.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]; then
            echo "main has moved on to $(git rev-parse --short origin/main); its run publishes the catalog"
            exit 0
          fi

          VERSION=$(git describe --tags)
          VERSION=${VERSION#v}
          make catalog BUNDLE_IMG="${QUAY_ORG}/jumpstarter-operator-bundle:${VERSION}"
          # The catalog image has no RUN step, so building it for arm64 needs no emulation.
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            -f Containerfile.catalog \
            -t "${QUAY_ORG}/jumpstarter-operator-catalog:unstable" \
            -t "${QUAY_ORG}/jumpstarter-operator-catalog:${VERSION}" \
            .
