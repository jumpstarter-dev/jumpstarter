name: End-to-end tests

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  # A push to main only runs the build jobs, to save their caches where pull
  # requests and the merge queue can restore them: a cache saved by a pull
  # request or a merge-queue run is visible to that ref alone. The tests have
  # already passed in the merge queue on this exact tree.
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CONTAINER_TOOL: docker
  # Retry a failed spec once before failing the job. Retries are reported as
  # flakes in the ginkgo summary, so this hides nothing; it only stops a single
  # infrastructure hiccup from failing an unrelated PR.
  E2E_FLAKE_ATTEMPTS: "2"
  # Run the non-Serial containers two at a time. The runner has 4 CPUs and the
  # suite spends most of its time waiting on the cluster, so a second process
  # overlaps the two long containers (hooks, core) rather than competing for CPU.
  E2E_PROCS: "2"

jobs:
  changes:
    if: github.repository_owner == 'jumpstarter-dev'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.e2e }}
      e2e-matrix: ${{ steps.matrix.outputs.e2e-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          base: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref }}
          # Required for the '!...' exclusion patterns below to work; with the
          # default 'some' quantifier a negated pattern matches every file it
          # does NOT cover, so docs-only PRs would still trigger e2e.
          predicate-quantifier: some-with-excludes
          filters: |
            # Run e2e on any change except pure documentation/tooling:
            # the suite exercises the whole stack, so a positive path list
            # would keep missing new code directories (e.g. rust/).
            e2e:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.mdc'
              - '!.devcontainer/**'
      - name: Compute e2e architecture matrix
        id: matrix
        run: |
          # PRs: run only amd64 e2e tests to save CI time.
          # Merge queue and workflow_dispatch run both architectures.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'e2e-matrix=[{"os": "ubuntu-24.04", "arch": "amd64"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'e2e-matrix=[{"os": "ubuntu-24.04", "arch": "amd64"}, {"os": "ubuntu-24.04-arm", "arch": "arm64"}]' >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================================
  # Build jobs: container images and Python wheels built in parallel
  # ===========================================================================

  build-controller-image:
    needs: changes
    if: needs.changes.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include: ${{ fromJson(needs.changes.outputs.e2e-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"

      # e2e-tests restores the kind, kustomize and grpcurl it builds from
      # source, but only saves them in its own run's scope. Build them here on
      # pushes to main, where every pull request can restore them. Saved before
      # the image build, which leaves its own binaries in controller/bin.
      - name: Read tool versions from Makefile
        if: github.event_name == 'push'
        uses: ./.github/actions/read-tool-versions

      - name: Restore controller tools
        if: github.event_name == 'push'
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: controller/bin
          key: controller-tools-${{ matrix.arch }}-kind${{ env.KIND_VERSION }}-kustomize${{ env.KUSTOMIZE_VERSION }}-grpcurl${{ env.GRPCURL_VERSION }}

      - name: Build controller tools
        if: github.event_name == 'push' && steps.tools-cache.outputs.cache-hit != 'true'
        run: make -C controller kind kustomize grpcurl

      - name: Save controller tools
        if: github.event_name == 'push' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: controller/bin
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

      - name: Restore controller image
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/controller-image.tar
          key: controller-image-${{ matrix.arch }}-${{ hashFiles('.go-version', 'controller/Makefile', 'controller/Containerfile', 'controller/Containerfile.prebuilt', 'controller/go.mod', 'controller/go.sum', 'controller/cmd/**', 'controller/api/**', 'controller/internal/**') }}

      - name: Build controller image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          make -C controller docker-build-ci
          docker save quay.io/jumpstarter-dev/jumpstarter-controller:latest -o /tmp/controller-image.tar

      # Not from the merge queue: its refs are used once, so nothing could
      # restore the cache, and it would only evict caches other runs need.
      - name: Save controller image
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/controller-image.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload controller image
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: controller-image-${{ matrix.arch }}
          path: /tmp/controller-image.tar
          retention-days: 1

  build-operator-image:
    needs: changes
    if: needs.changes.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include: ${{ fromJson(needs.changes.outputs.e2e-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"

      - name: Restore operator artifacts
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /tmp/operator-image.tar
            /tmp/operator-install.yaml
          key: operator-image-${{ matrix.arch }}-${{ hashFiles('.go-version', 'controller/Makefile', 'controller/Containerfile.operator', 'controller/Containerfile.prebuilt', 'controller/go.mod', 'controller/go.sum', 'controller/deploy/operator/**', 'controller/api/**', 'controller/internal/**') }}

      - name: Build operator image and installer manifest
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          make -C controller/deploy/operator docker-build-ci build-installer VERSION=latest
          docker save quay.io/jumpstarter-dev/jumpstarter-operator:latest -o /tmp/operator-image.tar
          cp controller/deploy/operator/dist/install.yaml /tmp/operator-install.yaml

      - name: Save operator artifacts
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /tmp/operator-image.tar
            /tmp/operator-install.yaml
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload operator artifacts
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operator-image-${{ matrix.arch }}
          path: |
            /tmp/operator-image.tar
            /tmp/operator-install.yaml
          retention-days: 1

  build-exporterset-controller-image:
    needs: changes
    if: needs.changes.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include: ${{ fromJson(needs.changes.outputs.e2e-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"

      - name: Restore exporterset-controller image
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/exporterset-controller-image.tar
          key: exporterset-controller-image-${{ matrix.arch }}-${{ hashFiles('.go-version', 'controller/Makefile', 'controller/Containerfile.exporter-set-controller', 'controller/Containerfile.prebuilt', 'controller/go.mod', 'controller/go.sum', 'controller/cmd/exporter-set-controller/**', 'controller/api/**', 'controller/internal/**') }}

      - name: Build exporterset-controller image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          make -C controller docker-build-exporter-set-controller-ci
          docker save quay.io/jumpstarter-dev/jumpstarter-exporterset-controller:latest -o /tmp/exporterset-controller-image.tar

      - name: Save exporterset-controller image
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/exporterset-controller-image.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload exporterset-controller image
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: exporterset-controller-image-${{ matrix.arch }}
          path: /tmp/exporterset-controller-image.tar
          retention-days: 1

  build-exporter-image:
    needs: changes
    if: needs.changes.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include: ${{ fromJson(needs.changes.outputs.e2e-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Restore exporter image
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/exporter-image.tar
          # Bust when exporter image inputs change: Containerfile, Python sources,
          # lockfiles, or embedded jumpstarter-exec (rust/).
          key: exporter-image-${{ matrix.arch }}-${{ hashFiles('python/Containerfile', 'python/packages/**/*.py', 'python/**/pyproject.toml', 'python/uv.lock', 'rust/jumpstarter-exec/**', 'controller/Makefile') }}

      - name: Build exporter image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          make -C controller docker-build-exporter
          docker save quay.io/jumpstarter-dev/jumpstarter:latest -o /tmp/exporter-image.tar

      - name: Save exporter image
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/exporter-image.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload exporter image
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: exporter-image-${{ matrix.arch }}
          path: /tmp/exporter-image.tar
          retention-days: 1

  build-qemu-runtime-image:
    needs: changes
    if: needs.changes.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include: ${{ fromJson(needs.changes.outputs.e2e-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Restore qemu-runtime image
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/qemu-runtime-image.tar
          # Bust when QEMU runtime inputs change.
          key: qemu-runtime-image-${{ matrix.arch }}-${{ hashFiles('controller/Makefile', 'controller/Containerfile.qemu-runtime') }}

      - name: Build qemu-runtime image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          make -C controller docker-build-qemu-runtime
          docker save quay.io/jumpstarter-dev/virtual/qemu-runtime:latest -o /tmp/qemu-runtime-image.tar

      - name: Save qemu-runtime image
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/qemu-runtime-image.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload qemu-runtime image
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qemu-runtime-image-${{ matrix.arch }}
          path: /tmp/qemu-runtime-image.tar
          retention-days: 1

  build-python-wheels:
    needs: changes
    if: needs.changes.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: uv
        run: echo "version=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version-file: .py-version

      - name: Restore python wheels
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: python/dist
          key: python-wheels-${{ hashFiles('python/**/*.py', 'python/**/pyproject.toml', 'python/uv.lock') }}

      - name: Build python wheels
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: python
        run: uv build --all --out-dir dist

      - name: Save python wheels
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: python/dist
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload python wheels
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-wheels
          path: python/dist/
          retention-days: 1

  # ===========================================================================
  # E2E test jobs: depend on pre-built artifacts
  # ===========================================================================

  e2e-tests:
    needs: [changes, build-controller-image, build-operator-image, build-exporterset-controller-image, build-exporter-image, build-qemu-runtime-image, build-python-wheels]
    if: github.event_name != 'push'
    strategy:
      matrix:
        include: ${{ fromJson(needs.changes.outputs.e2e-matrix) }}
    runs-on: ${{ matrix.os }}
    # Includes ExporterSet QEMU coverage (TCG), including flash/boot.
    # Job > Ginkgo suite timeout (60m in e2e/lib/common.sh) for setup/log upload.
    timeout-minutes: 70
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: uv
        run: echo "version=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version-file: .py-version

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"

      - name: Load e2e artifacts
        uses: ./.github/actions/load-e2e-artifacts
        with:
          arch: ${{ matrix.arch }}

      - name: Install nftables and dnsmasq for dut-network E2E
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables dnsmasq-base

      - name: Load kernel modules for DUT network tests
        run: |
          for mod in veth bridge nf_nat nf_conntrack nft_masq nft_nat nft_chain_nat; do
            sudo modprobe "$mod" 2>/dev/null || true
          done

      - name: Read tool versions from Makefile
        uses: ./.github/actions/read-tool-versions

      - name: Cache controller tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: controller/bin
          key: controller-tools-${{ matrix.arch }}-kind${{ env.KIND_VERSION }}-kustomize${{ env.KUSTOMIZE_VERSION }}-grpcurl${{ env.GRPCURL_VERSION }}

      - name: Setup e2e test environment
        run: make e2e-setup
        env:
          CI: true
          SKIP_BUILD: "true"
          PREBUILT_WHEELS_DIR: /tmp/python-wheels
          OPERATOR_IMG: quay.io/jumpstarter-dev/jumpstarter-operator:latest

      - name: Run e2e tests
        run: make e2e-run
        env:
          CI: true

      - name: Collect and upload e2e logs
        if: always()
        uses: ./.github/actions/collect-e2e-logs
        with:
          artifact-name: e2e-logs-${{ matrix.arch }}

  # ============================================================================
  # Compatibility tests: cross-version interop between controller and client/exporter
  # ============================================================================

  e2e-compat-old-controller:
    needs: changes
    # Skip on PRs — compat tests run in merge queue and workflow_dispatch.
    if: >-
      github.event_name != 'pull_request'
      && github.event_name != 'push'
      && (needs.changes.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: uv
        run: echo "version=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version-file: .py-version

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"

      - name: Read tool versions from Makefile
        uses: ./.github/actions/read-tool-versions

      - name: Cache controller tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: controller/bin
          key: controller-tools-amd64-kind${{ env.KIND_VERSION }}-kustomize${{ env.KUSTOMIZE_VERSION }}-grpcurl${{ env.GRPCURL_VERSION }}

      - name: Setup compat environment (old controller)
        run: make e2e-compat-setup COMPAT_SCENARIO=old-controller
        env:
          CI: true
          # renovate: datasource=github-releases depName=jumpstarter-dev/jumpstarter
          COMPAT_CONTROLLER_TAG: v0.9.0

      - name: Run compat tests (old controller + new client/exporter)
        run: make e2e-compat-run COMPAT_TEST=old-controller
        env:
          CI: true

      - name: Collect and upload e2e logs
        if: always()
        uses: ./.github/actions/collect-e2e-logs
        with:
          artifact-name: e2e-logs-compat-old-controller

  e2e-compat-old-client:
    needs: [changes, build-controller-image, build-operator-image, build-exporterset-controller-image, build-exporter-image, build-qemu-runtime-image, build-python-wheels]
    # Skip on PRs — compat tests run in merge queue and workflow_dispatch.
    if: >-
      github.event_name != 'pull_request'
      && github.event_name != 'push'
      && (needs.changes.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: uv
        run: echo "version=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version-file: .py-version

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"

      - name: Load e2e artifacts
        uses: ./.github/actions/load-e2e-artifacts
        with:
          arch: amd64

      - name: Read tool versions from Makefile
        uses: ./.github/actions/read-tool-versions

      - name: Cache controller tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: controller/bin
          key: controller-tools-amd64-kind${{ env.KIND_VERSION }}-kustomize${{ env.KUSTOMIZE_VERSION }}-grpcurl${{ env.GRPCURL_VERSION }}

      - name: Setup compat environment (old client)
        run: make e2e-compat-setup COMPAT_SCENARIO=old-client
        env:
          CI: true
          # renovate: datasource=pypi depName=jumpstarter
          COMPAT_CLIENT_VERSION: "0.9.0"
          SKIP_BUILD: "true"
          PREBUILT_WHEELS_DIR: /tmp/python-wheels
          OPERATOR_IMG: quay.io/jumpstarter-dev/jumpstarter-operator:latest

      - name: Run compat tests (new controller + old client/exporter)
        run: make e2e-compat-run COMPAT_TEST=old-client
        env:
          CI: true

      - name: Collect and upload e2e logs
        if: always()
        uses: ./.github/actions/collect-e2e-logs
        with:
          artifact-name: e2e-logs-compat-old-client

  # https://github.com/orgs/community/discussions/26822
  e2e:
    runs-on: ubuntu-latest
    needs: [changes, e2e-tests, e2e-compat-old-controller, e2e-compat-old-client]
    # A push to main runs no tests, so there is nothing to gate.
    if: ${{ always() && github.event_name != 'push' }}
    steps:
      - run: exit 1
        # Fail on failures or cancellations. Also fail if e2e-tests was skipped
        # when it should have run (compat jobs are intentionally skipped on PRs).
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || (needs.e2e-tests.result == 'skipped' && needs.changes.outputs.should_run == 'true')
          }}
