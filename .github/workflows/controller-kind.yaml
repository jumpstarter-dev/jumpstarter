name: Kind based CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'controller/**'

jobs:
  deploy-kind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Run make deploy
        working-directory: controller
        run: make deploy

  e2e-test-operator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Run operator e2e test
        working-directory: controller
        run: make test-operator-e2e

      - name: Collect router failure diagnostics
        if: failure()
        working-directory: controller
        run: |
          export KUBECONFIG=/dev/null
          mkdir -p "$HOME/scratch"
          bin/kind get kubeconfig --name jumpstarter > "$HOME/scratch/operator-e2e.kubeconfig"
          export KUBECONFIG="$HOME/scratch/operator-e2e.kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          kubectl get pods -A -o wide
          kubectl describe deployments,pods -A -l component=router
          kubectl get events -A --field-selector type=Warning --sort-by=.metadata.creationTimestamp
          kubectl get pods -A -l component=router -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' |
          while read -r namespace pod; do
            kubectl logs -n "$namespace" "$pod" --all-containers --prefix --tail=200 || true
            kubectl logs -n "$namespace" "$pod" --all-containers --prefix --tail=200 --previous || true
          done
