syntax = "proto3";

package jumpstarter.v1;

// Shared types used across multiple Jumpstarter services.

// Exporter status information.
enum ExporterStatus {
  EXPORTER_STATUS_UNSPECIFIED = 0;              // Unspecified exporter status.
  EXPORTER_STATUS_OFFLINE = 1;                  // Exporter is offline.
  EXPORTER_STATUS_AVAILABLE = 2;                // Exporter is available to be leased.
  EXPORTER_STATUS_BEFORE_LEASE_HOOK = 3;        // Exporter is executing before lease hook(s).
  EXPORTER_STATUS_LEASE_READY = 4;              // Exporter is leased and ready to accept commands.
  EXPORTER_STATUS_AFTER_LEASE_HOOK = 5;         // Exporter is executing after lease hook(s).
  EXPORTER_STATUS_BEFORE_LEASE_HOOK_FAILED = 6; // Exporter before lease hook failed.
  EXPORTER_STATUS_AFTER_LEASE_HOOK_FAILED = 7;  // Exporter after lease hook failed.
}

// Source of log stream messages.
enum LogSource {
  LOG_SOURCE_UNSPECIFIED = 0;       // Unspecified log source.
  LOG_SOURCE_DRIVER = 1;            // Driver/device logs.
  LOG_SOURCE_BEFORE_LEASE_HOOK = 2; // beforeLease hook execution logs.
  LOG_SOURCE_AFTER_LEASE_HOOK = 3;  // afterLease hook execution logs.
  LOG_SOURCE_SYSTEM = 4;            // System/exporter logs.
}

// The direction of a driver port. It shows the end that has the service, not
// the direction of the data: each forward is a two-way stream.
enum PortDirection {
  PORT_DIRECTION_UNSPECIFIED = 0; // Unspecified direction. The controller rejects such a port.
  PORT_DIRECTION_PROVIDES = 1;    // A local service listens. The exporter connects to it for each forwarded connection.
  PORT_DIRECTION_REQUIRES = 2;    // A local driver uses a service on a different member. The exporter opens a local listener for it.
  PORT_DIRECTION_CONNECTS = 3;    // The port connects to a port of its own type. Two such ports make one path.
}

// How a driver port is attached to its device.
enum PortAttachment {
  PORT_ATTACHMENT_UNSPECIFIED = 0; // Unspecified attachment. It means PORT_ATTACHMENT_SOCKET.
  PORT_ATTACHMENT_SOCKET = 1;      // A local socket.
  PORT_ATTACHMENT_WIRED = 2;       // A cable or a bus. A forward cannot use it.
  PORT_ATTACHMENT_WIRELESS = 3;    // A radio medium. A forward cannot use it.
}

// The transport of a driver port.
enum PortTransport {
  PORT_TRANSPORT_UNSPECIFIED = 0; // Unspecified transport. It means PORT_TRANSPORT_STREAM.
  PORT_TRANSPORT_STREAM = 1;      // A TCP byte stream.
  PORT_TRANSPORT_DATAGRAM = 2;    // UDP. A forward cannot use it.
  PORT_TRANSPORT_FRAME = 3;       // Link-layer frames. A forward cannot use it.
}

// A named connection point on a driver, where a forward of a lease can
// connect it to a port of a different exporter. It is not a TCP port number,
// and the report does not contain the local address of the port.
message PortReport {
  string name = 1;               // Name of the port: a DNS label, unique in one exporter (for example "rootcanal").
  PortDirection direction = 2;   // Direction of the port.
  optional string protocol = 3;  // Free-text protocol tag (for example "hci-h4"). Compared only if the two ends set it.
  PortAttachment attachment = 4; // Attachment of the port. Unspecified means a socket.
  PortTransport transport = 5;   // Transport of the port. Unspecified means a stream.
}
