syntax = "proto3";

package jumpstarter.v1;

import "google/protobuf/timestamp.proto";

// A service that reverse-scrapes exporter metrics and receives structured logs.
// Implemented by jumpstarter-telemetry; not part of the controller.
service TelemetryService {
  // Persistent bidirectional stream: telemetry sends scrape requests,
  // exporter responds with metric snapshots (structured families plus optional OpenMetrics text).
  rpc MetricsStream(stream MetricsStreamRequest) returns (stream MetricsStreamResponse);

  // Push structured log entries to the telemetry service for Loki ingest.
  rpc PushLogs(PushLogsRequest) returns (PushLogsResponse);
}

// Exporter → Telemetry
message MetricsStreamRequest {
  oneof msg {
    MetricsRegister register = 1;                    // First message: identify this exporter.
    MetricsScrapeResponse scrape_response = 2;       // Subsequent: reply to a scrape.
  }
}

message MetricsRegister {
  string identity = 1; // Exporter CRD name (verified against the auth token by the server).
}

message MetricsScrapeResponse {
  bytes metrics_text = 1;                // Optional generate_latest() OpenMetrics text (legacy / debug).
  google.protobuf.Timestamp timestamp = 2; // When the snapshot was taken.
  // DD-3 sidecar: in-memory registry dump so the hub can merge and filter
  // exemplars without parsing OpenMetrics text (prometheus/common cannot).
  repeated MetricsFamily families = 3;
}

// Prometheus metric type for a MetricsFamily.
enum MetricsType {
  METRICS_TYPE_UNSPECIFIED = 0; // Unknown or unset type.
  METRICS_TYPE_COUNTER = 1;     // Monotonic counter.
  METRICS_TYPE_GAUGE = 2;       // Gauge.
  METRICS_TYPE_HISTOGRAM = 3;   // Histogram (bucket / sum / count samples).
  METRICS_TYPE_SUMMARY = 4;     // Summary.
  METRICS_TYPE_UNTYPED = 5;     // Untyped / unknown.
}

// One label name/value pair on a sample or exemplar.
message MetricsLabel {
  string name = 1;  // Label name.
  string value = 2; // Label value.
}

// OpenMetrics exemplar attached to a sample (JEP-0013 allowlist applied on the hub).
message MetricsExemplar {
  repeated MetricsLabel labels = 1;        // Exemplar labels (client, lease_id, …).
  double value = 2;                        // Exemplar observation value.
  google.protobuf.Timestamp timestamp = 3; // Optional exemplar timestamp.
}

// One collected sample from prometheus_client (including histogram _bucket/_sum/_count).
message MetricsSample {
  string name = 1;                  // Sample name (may include _bucket, _sum, _count).
  repeated MetricsLabel labels = 2; // Sample labels (histogram buckets include le).
  double value = 3;                 // Sample value.
  MetricsExemplar exemplar = 4;     // Optional exemplar for this sample.
}

// One metric family from CollectorRegistry.collect().
message MetricsFamily {
  string name = 1;                 // Family name (counters include _total; no _bucket/_sum/_count).
  string help = 2;                 // Help text.
  MetricsType type = 3;            // Family type.
  repeated MetricsSample samples = 4; // Collected samples, including exemplars.
}

// Telemetry → Exporter
message MetricsStreamResponse {
  oneof msg {
    MetricsScrapeRequest scrape_request = 1;
  }
}

// Empty request: "send your /metrics now".
message MetricsScrapeRequest {}

// Request to push log entries to the telemetry service.
message PushLogsRequest {
  repeated LogEntry entries = 1; // Log entries to push.
}

// Response to a PushLogs request.
message PushLogsResponse {
  uint32 accepted = 1; // Number of entries accepted.
  uint32 dropped = 2;  // Number of entries dropped (backpressure).
}

// A structured log entry from an exporter or client.
// Maps directly to a Loki log entry with stream labels and body fields.
message LogEntry {
  google.protobuf.Timestamp timestamp = 1; // When the log was emitted.
  string severity = 2;     // Log severity: debug, info, warning, error, critical.
  string message = 3;      // Human-readable log message.
  string component = 4;    // Loki stream label: cli, exporter, controller, router, telemetry.
  string exporter = 5;     // Loki stream label: exporter CRD name (bounded by cluster size).
  string lease = 6;        // Log body only (high cardinality): active lease name.
  string client = 7;       // Log body only (high cardinality): client CRD name.
  string operation = 8;    // Log body: operation name (flash, power, etc.).
  string result = 9;       // Log body: operation outcome (success, failure, etc.).
  string driver_type = 10; // Log body: driver category (storage, power, network, etc.).
  map<string, string> extra_fields = 11; // Additional structured key-value fields.
                                         // Capped at 16 entries, 64-char keys, 256-char values.
  string namespace = 12;   // Loki stream label: Kubernetes namespace (bounded by cluster size).
}
