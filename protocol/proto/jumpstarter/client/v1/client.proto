syntax = "proto3";

package jumpstarter.client.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "jumpstarter/v1/kubernetes.proto";
import "jumpstarter/v1/common.proto";

// Client-facing API service for managing exporters and leases.
service ClientService {
  // Retrieve a single exporter by resource name.
  rpc GetExporter(GetExporterRequest) returns (Exporter) {
    option (google.api.http) = {get: "/v1/{name=namespaces/*/exporters/*}"};
    option (google.api.method_signature) = "name";
  }
  // List exporters in a namespace with optional filtering.
  rpc ListExporters(ListExportersRequest) returns (ListExportersResponse) {
    option (google.api.http) = {get: "/v1/{parent=namespaces/*}/exporters"};
    option (google.api.method_signature) = "parent";
  }

  // Retrieve a single lease by resource name.
  rpc GetLease(GetLeaseRequest) returns (Lease) {
    option (google.api.http) = {get: "/v1/{name=namespaces/*/leases/*}"};
    option (google.api.method_signature) = "name";
  }
  // List leases in a namespace with optional filtering.
  rpc ListLeases(ListLeasesRequest) returns (ListLeasesResponse) {
    option (google.api.http) = {get: "/v1/{parent=namespaces/*}/leases"};
    option (google.api.method_signature) = "parent";
  }
  // Create a new lease for an exporter.
  rpc CreateLease(CreateLeaseRequest) returns (Lease) {
    option (google.api.http) = {
      post: "/v1/{parent=namespaces/*}/leases"
      body: "lease"
    };
    option (google.api.method_signature) = "parent,lease,lease_id";
  }
  // Update an existing lease.
  rpc UpdateLease(UpdateLeaseRequest) returns (Lease) {
    option (google.api.http) = {
      patch: "/v1/{lease.name=namespaces/*/leases/*}"
      body: "lease"
    };
    option (google.api.method_signature) = "lease,update_mask";
  }
  // Delete a lease by resource name.
  rpc DeleteLease(DeleteLeaseRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=namespaces/*/leases/*}"};
    option (google.api.method_signature) = "name";
  }

  // Retrieve a single lease template by resource name.
  rpc GetLeaseTemplate(GetLeaseTemplateRequest) returns (LeaseTemplate) {
    option (google.api.http) = {get: "/v1/{name=namespaces/*/leasetemplates/*}"};
    option (google.api.method_signature) = "name";
  }
  // List the lease templates in a namespace.
  rpc ListLeaseTemplates(ListLeaseTemplatesRequest) returns (ListLeaseTemplatesResponse) {
    option (google.api.http) = {get: "/v1/{parent=namespaces/*}/leasetemplates"};
    option (google.api.method_signature) = "parent";
  }

  // Rotate the authentication token for the client.
  rpc RotateToken(RotateTokenRequest) returns (RotateTokenResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=namespaces/*}/rotate-token"
      body: "*"
    };
    option (google.api.method_signature) = "parent";
  }
}

// An exporter resource representing a registered device provider.
message Exporter {
  option (google.api.resource) = {
    type: "jumpstarter.dev/Exporter"
    pattern: "namespaces/{namespace}/exporters/{exporter}"
    singular: "exporter"
    plural: "exporters"
  };

  // The resource name of the exporter.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The set of labels associated with the exporter.
  map<string, string> labels = 2;
  // Whether the exporter is currently online. Deprecated in favor of the status field.
  bool online = 3 [(google.api.field_behavior) = OUTPUT_ONLY, deprecated = true];
  // The current status of the exporter.
  jumpstarter.v1.ExporterStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // A human-readable message providing details about the exporter status.
  string status_message = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Whether the exporter is enabled for lease assignment.
  // When false, the controller will not assign new leases to this exporter.
  optional bool enabled = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Label keys on this exporter that the controller has marked as deprecated.
  // Keys are the deprecated label names; values are optional human-readable messages.
  map<string, string> deprecated_labels = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The ports that the drivers of the exporter declare. A forward of a lease can connect them.
  repeated jumpstarter.v1.PortReport ports = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A lease resource representing a reservation of an exporter.
message Lease {
  option (google.api.resource) = {
    type: "jumpstarter.dev/Lease"
    pattern: "namespaces/{namespace}/leases/{lease}"
    singular: "lease"
    plural: "leases"
  };

  // The resource name of the lease.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The label selector expression used to match an exporter.
  // Necessary only for a scalar lease: a lease with members or a template has none.
  string selector = 2 [(google.api.field_behavior) = IMMUTABLE];
  // The requested duration of the lease.
  optional google.protobuf.Duration duration = 3;
  // The server-computed effective duration of the lease.
  google.protobuf.Duration effective_duration = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The requested begin time of the lease.
  optional google.protobuf.Timestamp begin_time = 5;
  // The server-computed effective begin time of the lease.
  optional google.protobuf.Timestamp effective_begin_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The requested end time of the lease.
  optional google.protobuf.Timestamp end_time = 7;
  // The server-computed effective end time of the lease.
  optional google.protobuf.Timestamp effective_end_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The resource name of the client that owns this lease.
  optional string client = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "jumpstarter.dev/Client"}
  ];
  // The resource name of the exporter assigned to this lease.
  // The controller sets it only for a scalar lease; see member_statuses.
  optional string exporter = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "jumpstarter.dev/Exporter"}
  ];
  // The list of conditions reflecting the current state of the lease.
  repeated jumpstarter.v1.Condition conditions = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The name of a specific exporter to target for the lease.
  optional string exporter_name = 12 [(google.api.field_behavior) = IMMUTABLE];
  // The set of tags associated with the lease.
  map<string, string> tags = 13 [(google.api.field_behavior) = IMMUTABLE];
  // Allow leasing a disabled exporter. Only effective when exporter_name is set.
  // Useful for investigating broken exporters that have been administratively disabled.
  bool allow_disabled = 14 [(google.api.field_behavior) = IMMUTABLE];
  // User-defined context metadata for the lease (e.g. build_id, image_digest, VCS ref).
  map<string, string> context = 15 [(google.api.field_behavior) = IMMUTABLE];
  // Selector keys on this lease that the controller has marked as deprecated.
  // Keys are the deprecated label names; values are optional human-readable messages.
  map<string, string> deprecated_labels = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The requested list of client names to share this lease with (desired intent).
  repeated string shared_with = 17;
  // The server-computed effective set of client names actually granted shared
  // access, after the controller evaluates exporter access policies and client
  // existence. A name present in shared_with but absent here was denied by
  // policy or does not exist. Use this for access decisions and display.
  repeated string effective_shared_with = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The members of a member-form lease. Each member has a role name and selects one exporter.
  repeated LeaseMember members = 19 [(google.api.field_behavior) = IMMUTABLE];
  // Rules for sets of members.
  repeated LeaseConstraint constraints = 20 [(google.api.field_behavior) = IMMUTABLE];
  // The lease template that the controller expands into members and constraints.
  optional LeaseTemplateUse template = 21 [(google.api.field_behavior) = IMMUTABLE];
  // The state of each member of a member-form lease.
  repeated LeaseMemberStatus member_statuses = 22 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The forwards of a member-form lease. Each forward connects ports on different members.
  repeated LeaseForward forwards = 23 [(google.api.field_behavior) = IMMUTABLE];
  // The state of each forward of the lease.
  repeated LeaseForwardStatus forward_statuses = 24 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The state of one forward of a lease.
enum LeaseForwardState {
  // The state is not known.
  LEASE_FORWARD_STATE_UNSPECIFIED = 0;
  // The controller did not complete the setup.
  LEASE_FORWARD_STATE_PENDING = 1;
  // An optional member is omitted, and the forward cannot operate without it.
  LEASE_FORWARD_STATE_DISABLED = 2;
  // The setup is complete. No connection is open.
  LEASE_FORWARD_STATE_LISTENING = 3;
  // A minimum of one connection is open.
  LEASE_FORWARD_STATE_CONNECTED = 4;
  // The validation or the setup failed, or a necessary member is lost.
  LEASE_FORWARD_STATE_FAILED = 5;
}

// One end of a forward: a member of the lease and a port of its exporter.
message ForwardEndpoint {
  // The role name of the member.
  string member_name = 1;
  // The name of the port on the exporter of the member.
  string port_name = 2;
}

// A forward of a lease: a named set of endpoints that the controller connects through the router.
message LeaseForward {
  // The name of the forward. It is a DNS label, and no member of the lease has the same name.
  string name = 1;
  // The endpoints of the forward: two to eight, each on a different member.
  repeated ForwardEndpoint endpoints = 2;
}

// The state of one forward of a lease.
message LeaseForwardStatus {
  // The name of the forward.
  string name = 1;
  // The state of the forward.
  LeaseForwardState state = 2;
  // A human-readable message for the state, for example the cause of a failure.
  optional string message = 3;
}

// The state of one member of a lease.
enum LeaseMemberState {
  // The state is not known.
  LEASE_MEMBER_STATE_UNSPECIFIED = 0;
  // The member has no exporter at this time.
  LEASE_MEMBER_STATE_PENDING = 1;
  // The member has an exporter.
  LEASE_MEMBER_STATE_BOUND = 2;
  // An optional member has no exporter.
  LEASE_MEMBER_STATE_OMITTED = 3;
  // A bound member lost its exporter.
  LEASE_MEMBER_STATE_LOST = 4;
}

// A member of a lease: a role name and the selection of one exporter.
message LeaseMember {
  // The role name of the member. It is a DNS label.
  string name = 1;
  // The source of the exporter.
  oneof selection {
    // A label selector, as in Lease.selector.
    string selector = 2;
    // The name of a specific exporter.
    string exporter_name = 3;
  }
  // The lease can become ready without this member.
  bool optional = 4;
  // Allow a disabled exporter. Only effective with exporter_name.
  bool allow_disabled = 5;
  // Template expansion sets this field. CreateLease rejects a request that sets it.
  bool excluded = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A rule for a set of members of a lease.
message LeaseConstraint {
  // The role names of the members that the rule applies to.
  repeated string member_names = 1;
  // The rule.
  oneof rule {
    // A label key. The exporters of the members must have the same value of this label.
    string same_label = 2;
  }
}

// How a lease request uses a lease template.
message LeaseTemplateUse {
  // The name of the template: a bare name, or a resource name in the namespace of the request.
  string template = 1 [(google.api.resource_reference) = {type: "jumpstarter.dev/LeaseTemplate"}];
  // Optional roles that the lease does not bind.
  repeated string excluded_members = 2 [(google.api.field_behavior) = INPUT_ONLY];
  // Role name to label selector. The controller adds it to the template selector with AND.
  map<string, string> member_selectors = 3 [(google.api.field_behavior) = INPUT_ONLY];
  // The metadata.generation of the template that the controller expanded.
  int64 generation = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The state of one member of a lease.
message LeaseMemberStatus {
  // The role name of the member.
  string name = 1;
  // The state of the member.
  LeaseMemberState state = 2;
  // The resource name of the exporter of the member.
  optional string exporter = 3 [(google.api.resource_reference) = {type: "jumpstarter.dev/Exporter"}];
  // A machine-readable reason for the state.
  optional string reason = 4;
  // A human-readable message for the state.
  optional string message = 5;
  // The priority of the member from the access policy.
  int32 priority = 6;
  // Whether the member was granted with spot access.
  bool spot_access = 7;
}

// A member of a lease template, with its current availability.
message LeaseTemplateMember {
  // The member definition.
  LeaseMember member = 1;
  // The number of exporters that the client can lease now for this member.
  int32 available = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A named definition of lease members that a lab administrator publishes.
message LeaseTemplate {
  option (google.api.resource) = {
    type: "jumpstarter.dev/LeaseTemplate"
    pattern: "namespaces/{namespace}/leasetemplates/{leasetemplate}"
    singular: "leaseTemplate"
    plural: "leaseTemplates"
  };

  // The resource name of the lease template.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // A short description for persons.
  string description = 2;
  // Documentation links.
  repeated string docs = 3;
  // A link to an image of the setup.
  optional string image = 4;
  // Plain text instructions for persons.
  optional string instructions = 5;
  // The members of the template.
  repeated LeaseTemplateMember members = 6;
  // Rules for sets of members.
  repeated LeaseConstraint constraints = 7;
  // The duration of a lease whose request gives none.
  optional google.protobuf.Duration default_duration = 8;
  // The metadata.generation of the template.
  int64 generation = 9;
  // The clients that a lease is shared with when its request gives none.
  repeated string default_shared_with = 10;
  // The forwards of a lease that uses this template.
  repeated LeaseForward forwards = 11;
}

// Request to retrieve a lease template.
message GetLeaseTemplateRequest {
  // The resource name of the lease template.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "jumpstarter.dev/LeaseTemplate"}
  ];
}

// Request to list lease templates.
message ListLeaseTemplatesRequest {
  // The parent resource name (namespace).
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "jumpstarter.dev/LeaseTemplate"}
  ];
  // Maximum number of results to return.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Token for retrieving the next page of results.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response containing a list of lease templates.
message ListLeaseTemplatesResponse {
  // The list of lease templates.
  repeated LeaseTemplate lease_templates = 1;
  // Token for the next page of results.
  string next_page_token = 2;
}

// Request to retrieve an exporter.
message GetExporterRequest {
  // The resource name of the exporter.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "jumpstarter.dev/Exporter"}
  ];
  // When true, include labels hidden by controller configuration.
  bool show_hidden_labels = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request to list exporters.
message ListExportersRequest {
  // The parent resource name (namespace).
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "jumpstarter.dev/Exporter"}
  ];
  // Maximum number of results to return.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Token for retrieving the next page of results.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter expression for the results.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
  // When true, include labels hidden by controller configuration.
  bool show_hidden_labels = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response containing a list of exporters.
message ListExportersResponse {
  // The list of exporters.
  repeated Exporter exporters = 1;
  // Token for the next page of results.
  string next_page_token = 2;
}

// Request to retrieve a lease.
message GetLeaseRequest {
  // The resource name of the lease.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "jumpstarter.dev/Lease"}
  ];
}

// Request to list leases.
message ListLeasesRequest {
  // The parent resource name (namespace).
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "jumpstarter.dev/Lease"}
  ];
  // Maximum number of results to return.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Token for retrieving the next page of results.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter expression for the results.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
  // If true, return only active leases.
  optional bool only_active = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter expression for lease tags.
  string tag_filter = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response containing a list of leases.
message ListLeasesResponse {
  // The list of leases.
  repeated Lease leases = 1;
  // Token for the next page of results.
  string next_page_token = 2;
}

// Request to create a lease.
message CreateLeaseRequest {
  // The parent resource name (namespace).
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "jumpstarter.dev/Lease"}
  ];

  // The client-assigned identifier for the lease.
  string lease_id = 2 [(google.api.field_behavior) = OPTIONAL];
  // The lease resource to create.
  Lease lease = 3 [(google.api.field_behavior) = REQUIRED];
}

// Request to update a lease.
message UpdateLeaseRequest {
  // Field 3 was never assigned; reserved to prevent accidental reuse.
  reserved 3;
  // The lease resource with updated fields.
  Lease lease = 1 [(google.api.field_behavior) = REQUIRED];
  // The set of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
  // Client names to add to the lease's shared_with list. Only the lease owner can modify sharing.
  repeated string add_shared_with = 4;
  // Client names to remove from the lease's shared_with list. Only the lease owner can modify sharing.
  repeated string remove_shared_with = 5;
}

// Request to delete a lease.
message DeleteLeaseRequest {
  // The resource name of the lease.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "jumpstarter.dev/Lease"}
  ];
}

// Request to rotate the authentication token for a client.
message RotateTokenRequest {
  // The parent resource name (namespace).
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "jumpstarter.dev/Client"}
  ];
}

// Response containing the newly rotated token.
message RotateTokenResponse {
  // The new authentication token.
  string token = 1;
  // The expiration time of the new token.
  google.protobuf.Timestamp expiry = 2;
}
